# ============================================================
# RSIDIS SSA analysis configuration
# Setting: LH2, PI-SIDIS, z=0.5, thpq=2.0, ebeam=8.5831
# ============================================================

# ---- Kinematic setting ----
setting:
  ebeam:    8.5831
  x:        0.25
  Q2:       3.3
  z:        0.5
  thpq:     2.0
  run_type: PI-SIDIS

# Signal target to analyze.
target: LH2
run_period: period_1

# Subtract e⁺ charge-symmetric background?
do_eplus_subtraction: true

# Subtract dummy target (LH2/LD2 only)?
do_dummy_subtraction: true

# ---- ROOT files ----
rootfiles:
  directory:  ../data/rootfiles_pass0p1
  pattern:    skimmed_coin_replay_production_{run}_-1.root
  treename:   T

# ---- Run table ----
runlist:
  csv: ../data/rsidis_bigtable_pass0p1.csv

# ---- Normalization ----
normalization:
  charge_column: BCM2_Q

# ---- Event selection cuts ----
cuts:
  # HMS electron PID
  hsdelta_lo:    -8.0    # %
  hsdelta_hi:     8.0    # %
  hcer_npe_min:   1.0
  hsshsum_min:    0.7

  # SHMS pion PID
  psdelta_lo:   -10.0    # %
  psdelta_hi:    20.0    # %
  paero_npe_min:  2.0
  phgc_npe_min:   1.0

  # Coincidence time — real peak
  ctime_real_center:          auto
  ctime_real_nsigma:          3.0
  ctime_real_window_fallback: 2.0

  # Coincidence time — random sideband
  ctime_random_center:  39.2
  ctime_random_window:  6.0

# ---- Histograms ----
histograms:
  # HMS acceptance
  - name:   hsdelta
    branch: H_gtr_dp
    bins:   16
    xmin:   -8.0
    xmax:    8.0
    xlabel: "HMS #delta (%)"

  - name:   hsxptar
    branch: H_gtr_th
    bins:   50
    xmin:   -0.1
    xmax:    0.1
    xlabel: "HMS xptar (rad)"

  - name:   hsyptar
    branch: H_gtr_ph
    bins:   50
    xmin:   -0.06
    xmax:    0.06
    xlabel: "HMS yptar (rad)"

  - name:   hsytar
    branch: H_gtr_y
    bins:   50
    xmin:   -5.0
    xmax:    5.0
    xlabel: "HMS ytar (cm)"

  # SHMS acceptance
  - name:   psdelta
    branch: P_gtr_dp
    bins:   30
    xmin:   -10.0
    xmax:    20.0
    xlabel: "SHMS #delta (%)"

  - name:   psxptar
    branch: P_gtr_th
    bins:   50
    xmin:   -0.1
    xmax:    0.1
    xlabel: "SHMS xptar (rad)"

  - name:   psyptar
    branch: P_gtr_ph
    bins:   50
    xmin:   -0.06
    xmax:    0.06
    xlabel: "SHMS yptar (rad)"

  - name:   psytar
    branch: P_gtr_y
    bins:   50
    xmin:   -5.0
    xmax:    5.0
    xlabel: "SHMS ytar (cm)"

  # Physics quantities
  - name:   W
    branch: H_kin_primary_W
    bins:   50
    xmin:    2.0
    xmax:    4.0
    xlabel: "W (GeV)"

  - name:   Q2
    branch: H_kin_primary_Q2
    bins:   50
    xmin:    2.0
    xmax:    5.0
    xlabel: "Q^{2} (GeV^{2})"

  - name:   xbj
    branch: H_kin_primary_x_bj
    bins:   50
    xmin:    0.1
    xmax:    0.4
    xlabel: "x_{Bj}"

  - name:   zhad
    branch: z
    bins:   45
    xmin:    0.1
    xmax:    1.0
    xlabel: "z_{had}"

  - name:   Pt
    branch: pt
    bins:   50
    xmin:    0.0
    xmax:    0.5
    xlabel: "P_{T} (GeV/c)"

  # Azimuthal angle (full + helicity-split)
  - name:   phipq
    branch: P_kin_secondary_ph_xq
    bins:   16
    xmin:   -3.14159265
    xmax:    3.14159265
    xlabel: "#phi_{pq} (rad)"

  - name:   phipq_hplus
    branch: P_kin_secondary_ph_xq
    bins:   16
    xmin:   -3.14159265
    xmax:    3.14159265
    xlabel: "#phi_{pq} (rad)  [h^{+}]"
    helicity_cut: positive

  - name:   phipq_hminus
    branch: P_kin_secondary_ph_xq
    bins:   16
    xmin:   -3.14159265
    xmax:    3.14159265
    xlabel: "#phi_{pq} (rad)  [h^{-}]"
    helicity_cut: negative
