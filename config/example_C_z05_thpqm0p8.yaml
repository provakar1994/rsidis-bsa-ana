# ============================================================
# RSIDIS SSA analysis configuration
# Setting: Carbon, PI-SIDIS, z=0.5, thpq=2.0, ebeam=8.5831
# ============================================================

# ---- Kinematic setting ----
# Uniquely selects runs from the runlist CSV.
# ebeam, x, Q2, z, thpq are matched with a tolerance of ±0.02.
setting:
  ebeam:    10.6716
  x:        0.25
  Q2:       3.3
  z:        0.5
  thpq:     -0.8
  run_type: PI-SIDIS   # PI-SIDIS or PI+SIDIS

# Signal target to analyze.
# For cryo targets (LH2, LD2), set do_dummy_subtraction: true.
target: C
run_period: period_1

# Subtract e⁺ charge-symmetric background (runs with hms_p > 0)?
# The e⁺ runs for this setting are identified automatically from the runlist.
do_eplus_subtraction: true

# Subtract dummy target (only for LH2/LD2)?
do_dummy_subtraction: false

# ---- ROOT files ----
rootfiles:
  directory:  ../data/rootfiles_pass0p1
  pattern:    skimmed_coin_replay_production_{run}_-1.root
  treename:   T

# ---- Run table ----
runlist:
  csv: ../data/rsidis_bigtable_pass0p1.csv

# ---- Normalization ----
# comp_livetime is a fraction (0–1), not a percentage.
# boil_corr is applied only when do_dummy_subtraction is true AND
# the target is a cryo target (LH2/LD2).
normalization:
  charge_column:     BCM2_Q
  # apply_boil_corr is set automatically based on target; listed here
  # for documentation only.
  # apply_boil_corr: false   # <- set true for LH2/LD2 targets

# ---- Event selection cuts ----
# These cuts are applied identically to signal (e⁻) and background (e⁺) runs.
# Nothing in the analysis code is hardcoded — change values here only.
cuts:
  # HMS electron PID
  hsdelta_lo:    -8.0    # %
  hsdelta_hi:     8.0    # %
  hcer_npe_min:   1.0
  hsshsum_min:    0.7

  # SHMS pion PID
  psdelta_lo:   -10.0    # %
  psdelta_hi:    20.0    # %
  paero_npe_min:  2.0
  phgc_npe_min:   1.0
  psshsum_max:    0.8

  # Coincidence time — real peak
  # Use 'auto' to take ctmean from the runlist CSV for each run,
  # or supply a fixed value in ns.
  ctime_real_center:          auto    # use CSV ctmean per run
  ctime_real_nsigma:          null    # ± n * ctsigma around the peak or null ← use fallback window always
  ctime_real_window_fallback: 2.0     # ns half-width when ctsigma = NaN

  # Coincidence time — random sideband (discrete windows around beam-bunch peaks)
  # Peak centers: ctmean ± (n_skip + k) × beam_bunch_ns  for k = 1…n_peaks
  # win_scale = 1 / (n_peaks_lo + n_peaks_hi)  (constant)
  ctime_random_n_skip:     1   # beam-bunch peaks to skip on each side of real peak (≥ 1)
  ctime_random_n_peaks_lo: 6   # random peaks to use on the low-ctime side
  ctime_random_n_peaks_hi: 0   # random peaks to use on the high-ctime side

# ---- Histograms ----
# Each entry defines one 1-D histogram.
# branch: the T-tree branch name (uses '_' separators, no '.').
# Adding a new histogram requires only a new block here — no code changes.
histograms:
  # HMS acceptance
  - name:   hsdelta
    branch: H_gtr_dp
    bins:   16
    xmin:   -8.0
    xmax:    8.0
    xlabel: "HMS #delta (%)"

  - name:   hsxptar
    branch: H_gtr_th
    bins:   50
    xmin:   -0.1
    xmax:    0.1
    xlabel: "HMS xptar (rad)"

  - name:   hsyptar
    branch: H_gtr_ph
    bins:   50
    xmin:   -0.06
    xmax:    0.06
    xlabel: "HMS yptar (rad)"

  - name:   hsytar
    branch: H_gtr_y
    bins:   50
    xmin:   -5.0
    xmax:    5.0
    xlabel: "HMS ytar (cm)"

  # SHMS acceptance
  - name:   psdelta
    branch: P_gtr_dp
    bins:   30
    xmin:   -10.0
    xmax:    20.0
    xlabel: "SHMS #delta (%)"

  - name:   psxptar
    branch: P_gtr_th
    bins:   50
    xmin:   -0.1
    xmax:    0.1
    xlabel: "SHMS xptar (rad)"

  - name:   psyptar
    branch: P_gtr_ph
    bins:   50
    xmin:   -0.06
    xmax:    0.06
    xlabel: "SHMS yptar (rad)"

  - name:   psytar
    branch: P_gtr_y
    bins:   50
    xmin:   -5.0
    xmax:    5.0
    xlabel: "SHMS ytar (cm)"

  # Physics quantities
  - name:   W
    branch: H_kin_primary_W
    bins:   50
    xmin:    2.0
    xmax:    4.0
    xlabel: "W (GeV)"

  - name:   Q2
    branch: H_kin_primary_Q2
    bins:   50
    xmin:    2.0
    xmax:    6.0
    xlabel: "Q^{2} (GeV^{2})"

  - name:   xbj
    branch: H_kin_primary_x_bj
    bins:   50
    xmin:    0.1
    xmax:    0.4
    xlabel: "x_{Bj}"

  - name:   zhad
    branch: z
    bins:   45
    xmin:    0.1
    xmax:    1.0
    xlabel: "z_{had}"

  - name:   Pt
    branch: pt
    bins:   50
    xmin:    0.0
    xmax:    0.5
    xlabel: "P_{T} (GeV/c)"

  # Azimuthal angle (full + helicity-split)
  - name:   phipq
    branch: P_kin_secondary_ph_xq
    bins:   16
    xmin:   -3.14159265
    xmax:    3.14159265
    xlabel: "#phi_{pq} (rad)"

  - name:   phipq_hplus
    branch: P_kin_secondary_ph_xq
    bins:   16
    xmin:   -3.14159265
    xmax:    3.14159265
    xlabel: "#phi_{pq} (rad)  [h^{+}]"
    helicity_cut: positive    # fill only when effective helicity > 0

  - name:   phipq_hminus
    branch: P_kin_secondary_ph_xq
    bins:   16
    xmin:   -3.14159265
    xmax:    3.14159265
    xlabel: "#phi_{pq} (rad)  [h^{-}]"
    helicity_cut: negative    # fill only when effective helicity < 0
